<header><h1>Responsive layout review</h1><label for="page">Page<select id="page"><option value="../">Homepage</option><option value="../7-day-life-admin-reset/">The 7-Day Life Admin Reset</option><option value="../ai-operations-architect/">AI Operations Architect</option><option value="../ai-prompt-vault/">AI Prompt Vault</option><option value="../workflow-builder-bundle/">Workflow Builder Bundle</option><option value="../ai-ready-workflow-builder-os/">Workflow Builder OS</option><option value="../brand-activation-production-os/">Brand Activation Production OS</option><option value="../claritypack10/">ClarityPack10 Pro Bundle</option><option value="../client-delivery-os/">Client Delivery OS</option><option value="../compliance-architect/">Compliance Architect</option><option value="../document-intake-system/">Document Intake System</option><option value="../event-agency-command-center/">Event Agency Command Center</option><option value="../freelancer-tax-desk/">Freelancer Tax Desk</option><option value="../workflow-sop-ai-guide/">Workflow SOP &amp; AI Guide</option><option value="../overdue-payments-agent-bundle/">Overdue Payments Agent</option><option value="../the-recovery-desk/">The Recovery Desk</option><option value="../weekly-reset-tracker/">Weekly Reset Tracker</option><option value="../claritypack10/tools/caregiver-handoff-builder/">ClarityPack10: Caregiver Handoff Builder</option><option value="../claritypack10/tools/contractor-quote-comparison/">ClarityPack10: Contractor Quote Comparison</option><option value="../claritypack10/tools/digital-emergency-map/">ClarityPack10: Digital Emergency Map</option><option value="../claritypack10/tools/freelancer-scope-creep-checker/">ClarityPack10: Freelancer Scope Creep Checker</option><option value="../claritypack10/tools/home-repair-decision-log/">ClarityPack10: Home Repair Decision Log</option><option value="../claritypack10/tools/insurance-claim-inventory/">ClarityPack10: Insurance Claim Inventory</option><option value="../claritypack10/tools/moving-quote-comparison/">ClarityPack10: Moving Quote Comparison</option><option value="../claritypack10/tools/renter-move-in-condition-report/">ClarityPack10: Renter Move In Condition Report</option><option value="../claritypack10/tools/subscription-cancellation-record/">ClarityPack10: Subscription Cancellation Record</option><option value="../claritypack10/tools/used-car-evidence-pack/">ClarityPack10: Used Car Evidence Pack</option></select></label><label for="width">Preview width<select id="width"><option value="320">320 px</option><option value="375" selected>375 px</option><option value="390">390 px</option><option value="768">768 px</option><option value="1024">1024 px</option><option value="1160">1160 px</option></select></label><output id="result" aria-live="polite">Loading homepage…</output><a href="../">Open the homepage</a></header>
<main><iframe src="../" title="Homepage at a narrow viewport" id="frame"></iframe></main>
<script>
const frame=document.getElementById('frame');
const width=document.getElementById('width');
const page=document.getElementById('page');
const result=document.getElementById('result');
function measure(){try{const root=frame.contentDocument.documentElement;result.textContent='Layout: '+root.clientWidth+' px · '+(root.scrollWidth>root.clientWidth?'Horizontal overflow: '+(root.scrollWidth-root.clientWidth)+' px':'No horizontal overflow');}catch{result.textContent='Open the homepage to review this viewport.';}}
frame.addEventListener('load',measure);
page.addEventListener('change',()=>{result.textContent='Loading page…';frame.title=page.selectedOptions[0].text+' at the selected viewport';frame.src=page.value;});
width.addEventListener('change',()=>{frame.style.width=width.value+'px';measure();});
</script>
